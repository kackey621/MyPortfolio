<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お知らせ — 草間 暁</title>
<meta name="description" content="草間 暁（AKIRA KUSAMA）からのお知らせ・プレスリリースの詳細。">
<meta name="theme-color" content="#ECEBE4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#main">本文へスキップ</a>
<header id="site-header"></header>

<main id="main">
  <div class="page-hero">
    <div class="wrap-narrow">
      <nav class="breadcrumb" aria-label="パンくず">
        <a href="index.html">Home</a><span class="sep">/</span>
        <a href="news.html">News</a><span class="sep">/</span><span id="rCrumb">…</span>
      </nav>
      <div id="rTag" class="release-tag" hidden></div>
      <h1 class="page-title" id="rTitle">お知らせ</h1>
      <div class="release-meta" id="rMeta"></div>
    </div>
  </div>

  <div class="article">
    <div class="wrap-narrow">
      <div class="md-body" id="rBody"><p class="news-empty">読み込み中…</p></div>
      <p style="margin-top:40px"><a class="sec-more-link" href="news.html">← お知らせ一覧へ戻る</a></p>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function () {
  "use strict";
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function fmt(iso){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||"");return m?m[1]+"."+m[2]+"."+m[3]:(iso||"");}
  function qs(k){return new URLSearchParams(location.search).get(k);}

  var slug = (qs("slug") || "").replace(/[^A-Za-z0-9._-]/g, "");
  var bodyEl = document.getElementById("rBody");
  var titleEl = document.getElementById("rTitle");
  var crumbEl = document.getElementById("rCrumb");
  var tagEl = document.getElementById("rTag");
  var metaEl = document.getElementById("rMeta");

  if (!slug) { fail("記事が指定されていません。"); return; }

  function fail(msg) {
    bodyEl.innerHTML = '<p class="news-empty">' + esc(msg) +
      ' <a href="news.html">お知らせ一覧へ</a></p>';
  }

  function parseFrontmatter(text) {
    var m = /^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/.exec(text);
    var meta = {}, body = text;
    if (m) {
      body = m[2];
      m[1].split("\n").forEach(function (line) {
        var mm = /^\s*([A-Za-z0-9_]+)\s*:\s*"?(.*?)"?\s*$/.exec(line);
        if (mm) meta[mm[1]] = mm[2];
      });
    }
    return { meta: meta, body: body };
  }

  // メタ情報（公開日・更新日）を news-index.json から取得（あれば）
  var metaPromise = fetch("assets/news-index.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (list) { return (list || []).filter(function (x) { return x.slug === slug; })[0] || null; })
    .catch(function () { return null; });

  Promise.all([
    fetch("news/" + slug + ".md", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("not found");
      return r.text();
    }),
    metaPromise
  ]).then(function (res) {
    var parsed = parseFrontmatter(res[0]);
    var idx = res[1] || {};
    var title = parsed.meta.title || idx.title || "お知らせ";
    document.title = title + " — 草間 暁";
    titleEl.textContent = title;
    crumbEl.textContent = title.length > 24 ? title.slice(0, 24) + "…" : title;

    var tag = parsed.meta.tag || idx.tag;
    if (tag) { tagEl.textContent = tag; tagEl.hidden = false; }

    var pub = parsed.meta.date || idx.date;
    var upd = idx.updated;
    var meta = [];
    if (pub) meta.push('<span><b>公開</b> ' + esc(fmt(pub)) + "</span>");
    if (upd && upd !== pub) meta.push('<span><b>更新</b> ' + esc(fmt(upd)) + "</span>");
    metaEl.innerHTML = meta.join("");

    // 本文の先頭 H1（タイトル重複）を除去してから描画
    var body = parsed.body.replace(/^\s*#\s+.*\n/, "");
    bodyEl.innerHTML = window.marked ? window.marked.parse(body) : esc(body);
  }).catch(function () {
    fail("記事を読み込めませんでした。ローカルで確認する場合は、file:// ではなく簡易サーバー（例: python3 -m http.server）経由で開いてください。");
  });
})();
</script>
</body>
</html>
