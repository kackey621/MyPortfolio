<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>スキルシート生成（ローカル専用）</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="page-head">
  <h1>スキルシート生成</h1>
  <p>
    サイトの「経歴」ページに掲載中の案件から選んで、テンプレートと同じ形式のまま書き出します。
    内容の編集はできません（変更は <code>assets/data.js</code> で）。このツールはローカル専用です。
  </p>
</header>

<div class="search-bar">
  <input id="searchInput" type="search" placeholder="会社名・案件名・技術で検索" autocomplete="off" />
  <div id="tagFilter" class="tag-filter"></div>
</div>

<main>
  <section class="picker" aria-label="案件を選ぶ">
    <ul id="tileGrid" class="tile-grid"></ul>
    <p id="emptyMessage" class="empty-message" hidden>該当する案件がありません</p>
  </section>

  <aside class="selection" aria-label="選択中の案件">
    <div class="selection-head">
      <h2>選択中 <span id="selectedCount">0</span> / <span id="maxCount">16</span></h2>
      <button id="generateBtn" type="button" class="primary">スキルシートを書き出す</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <ol id="selectedList" class="selected-list"></ol>
  </aside>
</main>

<template id="tileTemplate">
  <li>
    <button type="button" class="tile">
      <span class="tile-check" aria-hidden="true"></span>
      <span class="tile-main">
        <span class="tile-company"></span>
        <span class="tile-period"></span>
      </span>
      <span class="tile-tags"></span>
    </button>
  </li>
</template>

<template id="selectedRowTemplate">
  <li class="selected-row">
    <span class="s-company"></span>
    <span class="s-period"></span>
    <span class="s-controls">
      <button type="button" class="move-up" title="上へ">↑</button>
      <button type="button" class="move-down" title="下へ">↓</button>
      <button type="button" class="remove" title="除外">×</button>
    </span>
  </li>
</template>

<script src="app.js"></script>
</body>
</html>
