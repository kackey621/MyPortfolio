  <article class="article"><div class="wrap-narrow"><div class="md-body"><p>高等学校・情報科の教育職員免許状が交付されました。</p>
<p>大学在学中からの教職課程での学び、そして N高・S高や早稲田大学高等学院での指導経験を経て、正式に情報科教員としての資格を取得しました。今後は情報科教員として、日本の情報教育に貢献してまいります。</p></div><p style="margin-top:40px"><a class="sec-more-link" href="/news/">← お知らせ一覧へ戻る</a></p></div></article>
